openapi: 3.0.3
info:
  title: Sistem Manajemen Sekolah API
  version: 1.0.0
  description: |
    API v1 Sistem Manajemen Sekolah (PRD v1.5, Bagian 23). Aturan bisnis & validasi sama dengan
    panel Admin dan portal Guru/Siswa.

    **Autentikasi:** `POST /login` → salin `token` → kirim header `Authorization: Bearer <token>`.
    Token berlaku 120 menit dan dicabut saat `POST /logout`.

    **Akses:** Admin = seluruh endpoint. Guru/Siswa = `/me`, `/logout`, `/ringkasan`, dan `/laporan/{jenis}`
    yang dibatasi ke Kelasnya sendiri / Kelas yang diajar. Endpoint CRUD untuk Guru/Siswa → 403.

    **Batas:** 60 permintaan/menit per akun (tamu: per IP) → 429. Login: 3 kegagalan → dikunci 15 menit (422).

    **Error:** JSON `{ "message": "..." }` berbahasa Indonesia; validasi (422) menambah `errors` per field.

    Spesifikasi ini dijaga sinkron dengan rute & JSON Resource oleh `tests/Feature/Api/OpenApiTest.php`.
servers:
  - url: http://localhost:8000/api/v1
    description: Pengembangan lokal (APP_URL)
security:
  - bearerAuth: []
tags:
  - name: Autentikasi
  - name: Ringkasan & Laporan
  - name: Siswa
    description: Khusus Admin (PRD 5).
  - name: Kelas
    description: Khusus Admin (PRD 6).
  - name: Guru
    description: Khusus Admin (PRD 7).

paths:
  /login:
    post:
      tags: [Autentikasi]
      summary: Login dan dapatkan Bearer token
      description: >-
        Pesan gagal bersifat umum (PRD 4.4). Akun dengan profil di Trash ditolak (PRD 22.2).
        Maksimal 5 token aktif per akun: login berikutnya mencabut token tertua.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginPayload' }
            example: { email: admin@sekolah.test, password: password }
      responses:
        '200':
          description: Login berhasil.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginRespons' }
        '422': { $ref: '#/components/responses/ValidasiGagal' }
        '429': { $ref: '#/components/responses/TerlaluBanyak' }

  /logout:
    post:
      tags: [Autentikasi]
      summary: Logout (mencabut token yang dipakai)
      operationId: logout
      responses:
        '200':
          description: Logout berhasil.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pesan' }
              example: { message: Anda berhasil keluar dari sistem. }
        '401': { $ref: '#/components/responses/TidakLogin' }

  /me:
    get:
      tags: [Autentikasi]
      summary: Akun yang sedang login
      operationId: me
      responses:
        '200':
          description: Data akun.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/TidakLogin' }

  /ringkasan:
    get:
      tags: [Ringkasan & Laporan]
      summary: Total Siswa, Kelas, dan Guru aktif (PRD 11.3)
      operationId: ringkasan
      responses:
        '200':
          description: Ringkasan.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Ringkasan' }
        '401': { $ref: '#/components/responses/TidakLogin' }

  /laporan/{jenis}:
    get:
      tags: [Ringkasan & Laporan]
      summary: Laporan per Kelas (PRD 8–10)
      description: |
        Satu baris per Kelas aktif (setiap Kelas tepat satu kali), 10 Kelas per halaman, tanpa filter.
        Nama Siswa/Guru terurut A–Z; daftar kosong = "Belum ada data".
        Admin melihat seluruh Kelas; Siswa hanya Kelasnya; Guru hanya Kelas yang diajar (PRD 22.4).
      operationId: laporan
      parameters:
        - name: jenis
          in: path
          required: true
          schema: { $ref: '#/components/schemas/JenisLaporan' }
        - $ref: '#/components/parameters/Halaman'
      responses:
        '200':
          description: Satu halaman laporan.
          content:
            application/json:
              schema:
                type: object
                required: [data, links, meta, jenis, judul]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/LaporanKelas' }
                  links: { $ref: '#/components/schemas/TautanHalaman' }
                  meta: { $ref: '#/components/schemas/MetaHalaman' }
                  jenis: { $ref: '#/components/schemas/JenisLaporan' }
                  judul: { type: string, example: Daftar Siswa per Kelas }
        '401': { $ref: '#/components/responses/TidakLogin' }
        '404': { $ref: '#/components/responses/TidakDitemukan' }
        '422': { $ref: '#/components/responses/ValidasiGagal' }

  /siswa:
    get:
      tags: [Siswa]
      summary: Daftar Siswa (urut Nama A–Z)
      operationId: daftarSiswa
      parameters:
        - $ref: '#/components/parameters/Halaman'
        - $ref: '#/components/parameters/Trash'
      responses:
        '200':
          description: Satu halaman data.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Halaman'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Siswa' }
        '401': { $ref: '#/components/responses/TidakLogin' }
        '403': { $ref: '#/components/responses/Dilarang' }
        '422': { $ref: '#/components/responses/ValidasiGagal' }
    post:
      tags: [Siswa]
      summary: Tambah Siswa (opsional beserta akun portal)
      operationId: tambahSiswa
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiswaPayload' }
            example:
              nis: '00123'
              nama: Ani Lestari
              jenis_kelamin: P
              alamat: Jl. Melati 1
              kelas_id: 1
              akun: { email: ani@sekolah.test, password: rahasia123 }
      responses:
        '201': { $ref: '#/components/responses/SiswaTersimpan' }
        '401': { $ref: '#/components/responses/TidakLogin' }
        '403': { $ref: '#/components/responses/Dilarang' }
        '422': { $ref: '#/components/responses/ValidasiGagal' }

  /siswa/{siswa}:
    parameters:
      - $ref: '#/components/parameters/IdSiswa'
    get:
      tags: [Siswa]
      summary: Detail Siswa (termasuk yang di Trash)
      operationId: detailSiswa
      responses:
        '200': { $ref: '#/components/responses/SiswaData' }
        '401': { $ref: '#/components/responses/TidakLogin' }
        '403': { $ref: '#/components/responses/Dilarang' }
        '404': { $ref: '#/components/responses/TidakDitemukan' }
    put:
      tags: [Siswa]
      summary: Edit Siswa
      description: Kirim data lengkap. Tanpa kunci `akun` = akun tidak diubah. Siswa di Trash → 409.
      operationId: editSiswa
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiswaPayload' }
      responses:
        '200': { $ref: '#/components/responses/SiswaTersimpan' }
        '401': { $ref: '#/components/responses/TidakLogin' }
        '403': { $ref: '#/components/responses/Dilarang' }
        '404': { $ref: '#/components/responses/TidakDitemukan' }
        '409': { $ref: '#/components/responses/Konflik' }
        '422': { $ref: '#/components/responses/ValidasiGagal' }
    delete:
      tags: [Siswa]
      summary: Hapus Siswa (pindah ke Trash, relasi Kelas dilepas)
      operationId: hapusSiswa
      responses:
        '200': { $ref: '#/components/responses/Dihapus' }
        '401': { $ref: '#/components/responses/TidakLogin' }
        '403': { $ref: '#/components/responses/Dilarang' }
        '404': { $ref: '#/components/responses/TidakDitemukan' }
        '409': { $ref: '#/components/responses/Konflik' }

  /siswa/{siswa}/pulihkan:
    parameters:
      - $ref: '#/components/parameters/IdSiswa'
    post:
      tags: [Siswa]
      summary: Pulihkan Siswa dari Trash (wajib memilih Kelas aktif)
      operationId: pulihkanSiswa
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PulihkanSiswaPayload' }
      responses:
        '200': { $ref: '#/components/responses/SiswaTersimpan' }
        '401': { $ref: '#/components/responses/TidakLogin' }
        '403': { $ref: '#/components/responses/Dilarang' }
        '404': { $ref: '#/components/responses/TidakDitemukan' }
        '409': { $ref: '#/components/responses/Konflik' }
        '422': { $ref: '#/components/responses/ValidasiGagal' }

  /kelas:
    get:
      tags: [Kelas]
      summary: Daftar Kelas (urut Tingkat X–XI–XII, Jurusan, Nama Kelas)
      operationId: daftarKelas
      parameters:
        - $ref: '#/components/parameters/Halaman'
        - $ref: '#/components/parameters/Trash'
      responses:
        '200':
          description: Satu halaman data.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Halaman'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Kelas' }
        '401': { $ref: '#/components/responses/TidakLogin' }
        '403': { $ref: '#/components/responses/Dilarang' }
        '422': { $ref: '#/components/responses/ValidasiGagal' }
    post:
      tags: [Kelas]
      summary: Tambah Kelas
      operationId: tambahKelas
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KelasPayload' }
            example: { nama_kelas: X IPA 1, tingkat: X, jurusan: IPA, keterangan: Ruang 101 }
      responses:
        '201': { $ref: '#/components/responses/KelasTersimpan' }
        '401': { $ref: '#/components/responses/TidakLogin' }
        '403': { $ref: '#/components/responses/Dilarang' }
        '422': { $ref: '#/components/responses/ValidasiGagal' }

  /kelas/{kelas}:
    parameters:
      - $ref: '#/components/parameters/IdKelas'
    get:
      tags: [Kelas]
      summary: Detail Kelas (termasuk yang di Trash)
      operationId: detailKelas
      responses:
        '200': { $ref: '#/components/responses/KelasData' }
        '401': { $ref: '#/components/responses/TidakLogin' }
        '403': { $ref: '#/components/responses/Dilarang' }
        '404': { $ref: '#/components/responses/TidakDitemukan' }
    put:
      tags: [Kelas]
      summary: Edit Kelas
      description: Kelas di Trash → 409.
      operationId: editKelas
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KelasPayload' }
      responses:
        '200': { $ref: '#/components/responses/KelasTersimpan' }
        '401': { $ref: '#/components/responses/TidakLogin' }
        '403': { $ref: '#/components/responses/Dilarang' }
        '404': { $ref: '#/components/responses/TidakDitemukan' }
        '409': { $ref: '#/components/responses/Konflik' }
        '422': { $ref: '#/components/responses/ValidasiGagal' }
    delete:
      tags: [Kelas]
      summary: Hapus Kelas (pindah ke Trash)
      description: Ditolak (409) bila Kelas masih memiliki Siswa atau Guru aktif (PRD 6.6).
      operationId: hapusKelas
      responses:
        '200': { $ref: '#/components/responses/Dihapus' }
        '401': { $ref: '#/components/responses/TidakLogin' }
        '403': { $ref: '#/components/responses/Dilarang' }
        '404': { $ref: '#/components/responses/TidakDitemukan' }
        '409': { $ref: '#/components/responses/Konflik' }

  /kelas/{kelas}/pulihkan:
    parameters:
      - $ref: '#/components/parameters/IdKelas'
    post:
      tags: [Kelas]
      summary: Pulihkan Kelas dari Trash (relasi lama tidak dikembalikan)
      operationId: pulihkanKelas
      responses:
        '200': { $ref: '#/components/responses/KelasTersimpan' }
        '401': { $ref: '#/components/responses/TidakLogin' }
        '403': { $ref: '#/components/responses/Dilarang' }
        '404': { $ref: '#/components/responses/TidakDitemukan' }
        '409': { $ref: '#/components/responses/Konflik' }

  /guru:
    get:
      tags: [Guru]
      summary: Daftar Guru (urut Nama A–Z)
      operationId: daftarGuru
      parameters:
        - $ref: '#/components/parameters/Halaman'
        - $ref: '#/components/parameters/Trash'
      responses:
        '200':
          description: Satu halaman data.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Halaman'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Guru' }
        '401': { $ref: '#/components/responses/TidakLogin' }
        '403': { $ref: '#/components/responses/Dilarang' }
        '422': { $ref: '#/components/responses/ValidasiGagal' }
    post:
      tags: [Guru]
      summary: Tambah Guru (opsional beserta akun portal)
      operationId: tambahGuru
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuruPayload' }
            example:
              nip: ''
              nama: Budi Santoso
              jenis_kelamin: L
              alamat: Jl. Kenanga 2
              no_telepon: '+6281234567890'
              kelas: [1, 2]
      responses:
        '201': { $ref: '#/components/responses/GuruTersimpan' }
        '401': { $ref: '#/components/responses/TidakLogin' }
        '403': { $ref: '#/components/responses/Dilarang' }
        '422': { $ref: '#/components/responses/ValidasiGagal' }

  /guru/{guru}:
    parameters:
      - $ref: '#/components/parameters/IdGuru'
    get:
      tags: [Guru]
      summary: Detail Guru (termasuk yang di Trash)
      operationId: detailGuru
      responses:
        '200': { $ref: '#/components/responses/GuruData' }
        '401': { $ref: '#/components/responses/TidakLogin' }
        '403': { $ref: '#/components/responses/Dilarang' }
        '404': { $ref: '#/components/responses/TidakDitemukan' }
    put:
      tags: [Guru]
      summary: Edit Guru
      description: Kirim data lengkap. Tanpa kunci `akun` = akun tidak diubah. Guru di Trash → 409.
      operationId: editGuru
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuruPayload' }
      responses:
        '200': { $ref: '#/components/responses/GuruTersimpan' }
        '401': { $ref: '#/components/responses/TidakLogin' }
        '403': { $ref: '#/components/responses/Dilarang' }
        '404': { $ref: '#/components/responses/TidakDitemukan' }
        '409': { $ref: '#/components/responses/Konflik' }
        '422': { $ref: '#/components/responses/ValidasiGagal' }
    delete:
      tags: [Guru]
      summary: Hapus Guru (pindah ke Trash, seluruh relasi Kelas dilepas)
      operationId: hapusGuru
      responses:
        '200': { $ref: '#/components/responses/Dihapus' }
        '401': { $ref: '#/components/responses/TidakLogin' }
        '403': { $ref: '#/components/responses/Dilarang' }
        '404': { $ref: '#/components/responses/TidakDitemukan' }
        '409': { $ref: '#/components/responses/Konflik' }

  /guru/{guru}/pulihkan:
    parameters:
      - $ref: '#/components/parameters/IdGuru'
    post:
      tags: [Guru]
      summary: Pulihkan Guru dari Trash (wajib minimal satu Kelas aktif)
      operationId: pulihkanGuru
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PulihkanGuruPayload' }
      responses:
        '200': { $ref: '#/components/responses/GuruTersimpan' }
        '401': { $ref: '#/components/responses/TidakLogin' }
        '403': { $ref: '#/components/responses/Dilarang' }
        '404': { $ref: '#/components/responses/TidakDitemukan' }
        '409': { $ref: '#/components/responses/Konflik' }
        '422': { $ref: '#/components/responses/ValidasiGagal' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token dari `POST /login`.

  parameters:
    Halaman:
      name: page
      in: query
      required: false
      description: Nomor halaman (10 data per halaman).
      schema: { type: integer, minimum: 1, default: 1 }
    Trash:
      name: trash
      in: query
      required: false
      description: '1 = tampilkan data di Trash (PRD 13.2).'
      schema: { type: boolean, default: false }
    IdSiswa:
      name: siswa
      in: path
      required: true
      schema: { type: integer }
    IdKelas:
      name: kelas
      in: path
      required: true
      schema: { type: integer }
    IdGuru:
      name: guru
      in: path
      required: true
      schema: { type: integer }

  responses:
    SiswaData:
      description: Data Siswa.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/Siswa' }
    SiswaTersimpan:
      description: Siswa tersimpan.
      content:
        application/json:
          schema:
            type: object
            required: [data, message]
            properties:
              data: { $ref: '#/components/schemas/Siswa' }
              message: { type: string, example: Data berhasil ditambahkan. }
    KelasData:
      description: Data Kelas.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/Kelas' }
    KelasTersimpan:
      description: Kelas tersimpan.
      content:
        application/json:
          schema:
            type: object
            required: [data, message]
            properties:
              data: { $ref: '#/components/schemas/Kelas' }
              message: { type: string, example: Perubahan berhasil disimpan. }
    GuruData:
      description: Data Guru.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/Guru' }
    GuruTersimpan:
      description: Guru tersimpan.
      content:
        application/json:
          schema:
            type: object
            required: [data, message]
            properties:
              data: { $ref: '#/components/schemas/Guru' }
              message: { type: string, example: Data berhasil dipulihkan. }
    Dihapus:
      description: Data dipindahkan ke Trash.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Pesan' }
          example: { message: Data berhasil dipindahkan ke Trash. }
    TidakLogin:
      description: Token tidak ada, salah, kedaluwarsa, atau profil akun berada di Trash.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Pesan' }
          example: { message: Silakan login terlebih dahulu. }
    Dilarang:
      description: Peran akun tidak diizinkan (mis. Guru/Siswa ke endpoint CRUD).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Pesan' }
          example: { message: Anda tidak memiliki akses. }
    TidakDitemukan:
      description: Data atau endpoint tidak ditemukan.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Pesan' }
          example: { message: Data tidak ditemukan. }
    Konflik:
      description: Status data tidak memungkinkan aksi ini.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Pesan' }
          examples:
            diTrash: { value: { message: Data berada di Trash. Pulihkan terlebih dahulu. } }
            bukanTrash: { value: { message: Data tidak berada di Trash. } }
            kelasDipakai: { value: { message: Kelas masih memiliki Siswa aktif. } }
    ValidasiGagal:
      description: Data tidak valid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidasiError' }
          example:
            message: NIS wajib diisi. (dan 1 kesalahan lainnya)
            errors:
              nis: [NIS wajib diisi.]
              kelas_id: [Kelas yang dipilih tidak valid.]
    TerlaluBanyak:
      description: Batas permintaan terlampaui.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Pesan' }
          example: { message: Terlalu banyak permintaan. Silakan coba lagi nanti. }

  schemas:
    Pesan:
      type: object
      required: [message]
      properties:
        message: { type: string }
    ValidasiError:
      type: object
      required: [message, errors]
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    Role: { type: string, enum: [admin, guru, siswa] }
    Tingkat: { type: string, enum: [X, XI, XII] }
    JenisKelamin:
      type: string
      enum: [L, P]
      description: L = Laki-laki, P = Perempuan.
    JenisLaporan: { type: string, enum: [siswa-per-kelas, guru-per-kelas, siswa-kelas-guru] }

    LoginPayload:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    LoginRespons:
      type: object
      required: [token, token_type, user]
      properties:
        token: { type: string, example: '1|sekolah_abc123...', description: 'Format {id}|sekolah_{acak}; ditampilkan sekali.' }
        token_type: { type: string, enum: [Bearer] }
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      required: [id, name, email, role, siswa_id, guru_id]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        siswa_id: { type: integer, nullable: true }
        guru_id: { type: integer, nullable: true }

    Ringkasan:
      type: object
      required: [total_siswa, total_kelas, total_guru]
      properties:
        total_siswa: { type: integer }
        total_kelas: { type: integer }
        total_guru: { type: integer }
    LaporanKelas:
      type: object
      required: [id, nama_kelas, tingkat, jurusan]
      description: '`siswa` ada pada laporan siswa-per-kelas & siswa-kelas-guru; `guru` pada guru-per-kelas & siswa-kelas-guru.'
      properties:
        id: { type: integer }
        nama_kelas: { type: string }
        tingkat: { $ref: '#/components/schemas/Tingkat' }
        jurusan: { type: string, nullable: true }
        siswa:
          type: array
          items: { type: string }
        guru:
          type: array
          items: { type: string }

    KelasRingkas:
      type: object
      required: [id, nama_kelas, tingkat]
      properties:
        id: { type: integer }
        nama_kelas: { type: string }
        tingkat: { $ref: '#/components/schemas/Tingkat' }
    Kelas:
      type: object
      required: [id, nama_kelas, tingkat, jurusan, keterangan, jumlah_siswa, jumlah_guru, dihapus_pada]
      properties:
        id: { type: integer }
        nama_kelas: { type: string }
        tingkat: { $ref: '#/components/schemas/Tingkat' }
        jurusan: { type: string, nullable: true }
        keterangan: { type: string, nullable: true }
        jumlah_siswa: { type: integer, description: Siswa aktif. }
        jumlah_guru: { type: integer, description: Guru aktif. }
        dihapus_pada: { type: string, format: date-time, nullable: true, description: Terisi bila di Trash. }
    Siswa:
      type: object
      required: [id, nis, nama, jenis_kelamin, alamat, kelas, akun_email, dihapus_pada]
      properties:
        id: { type: integer }
        nis: { type: string, example: '00123' }
        nama: { type: string }
        jenis_kelamin: { $ref: '#/components/schemas/JenisKelamin' }
        alamat: { type: string }
        kelas:
          allOf:
            - $ref: '#/components/schemas/KelasRingkas'
          nullable: true
          description: null untuk Siswa di Trash.
        akun_email: { type: string, format: email, nullable: true }
        dihapus_pada: { type: string, format: date-time, nullable: true }
    Guru:
      type: object
      required: [id, nip, nama, jenis_kelamin, alamat, no_telepon, kelas, akun_email, dihapus_pada]
      properties:
        id: { type: integer }
        nip: { type: string, nullable: true }
        nama: { type: string }
        jenis_kelamin: { $ref: '#/components/schemas/JenisKelamin' }
        alamat: { type: string }
        no_telepon: { type: string, example: '081234567890' }
        kelas:
          type: array
          description: Terurut Tingkat → Jurusan → Nama Kelas; kosong untuk Guru di Trash.
          items: { $ref: '#/components/schemas/KelasRingkas' }
        akun_email: { type: string, format: email, nullable: true }
        dihapus_pada: { type: string, format: date-time, nullable: true }

    AkunPortalPayload:
      type: object
      description: Tanpa kunci `akun` = akun tidak diubah; email kosong = akun dihapus; password wajib saat akun baru.
      properties:
        email: { type: string, format: email, nullable: true, maxLength: 255 }
        password:
          type: string
          nullable: true
          minLength: 8
          pattern: '^(?=.*\p{L})(?=.*\d).+$'
          description: Min. 8 karakter, memuat huruf dan angka. Di production juga ditolak bila pernah bocor.
    KelasPayload:
      type: object
      required: [nama_kelas, tingkat]
      properties:
        nama_kelas: { type: string, maxLength: 100, description: Unik termasuk data di Trash. }
        tingkat: { $ref: '#/components/schemas/Tingkat' }
        jurusan: { type: string, nullable: true, maxLength: 100 }
        keterangan: { type: string, nullable: true }
    SiswaPayload:
      type: object
      required: [nis, nama, jenis_kelamin, alamat, kelas_id]
      properties:
        nis: { type: string, maxLength: 30, description: Unik termasuk data di Trash. }
        nama: { type: string, maxLength: 150 }
        jenis_kelamin: { $ref: '#/components/schemas/JenisKelamin' }
        alamat: { type: string }
        kelas_id: { type: integer, description: id Kelas aktif. }
        akun: { $ref: '#/components/schemas/AkunPortalPayload' }
    GuruPayload:
      type: object
      required: [nama, jenis_kelamin, alamat, no_telepon, kelas]
      properties:
        nip: { type: string, nullable: true, maxLength: 30, description: 'Opsional, unik bila diisi.' }
        nama: { type: string, maxLength: 150 }
        jenis_kelamin: { $ref: '#/components/schemas/JenisKelamin' }
        alamat: { type: string }
        no_telepon: { type: string, maxLength: 20, pattern: '^(\+62|0)8[0-9]{7,12}$' }
        kelas:
          type: array
          minItems: 1
          items: { type: integer, description: id Kelas aktif. }
        akun: { $ref: '#/components/schemas/AkunPortalPayload' }
    PulihkanSiswaPayload:
      type: object
      required: [kelas_id]
      properties:
        kelas_id: { type: integer }
    PulihkanGuruPayload:
      type: object
      required: [kelas]
      properties:
        kelas:
          type: array
          minItems: 1
          items: { type: integer }

    Halaman:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items: {}
        links: { $ref: '#/components/schemas/TautanHalaman' }
        meta: { $ref: '#/components/schemas/MetaHalaman' }
    TautanHalaman:
      type: object
      properties:
        first: { type: string, nullable: true }
        last: { type: string, nullable: true }
        prev: { type: string, nullable: true }
        next: { type: string, nullable: true }
    MetaHalaman:
      type: object
      properties:
        current_page: { type: integer }
        from: { type: integer, nullable: true }
        last_page: { type: integer }
        path: { type: string }
        per_page: { type: integer, example: 10 }
        to: { type: integer, nullable: true }
        total: { type: integer }
        links:
          type: array
          items:
            type: object
            properties:
              url: { type: string, nullable: true }
              label: { type: string }
              active: { type: boolean }
