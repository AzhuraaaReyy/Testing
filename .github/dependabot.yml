# Pembaruan dependency otomatis lewat Pull Request mingguan. Setiap PR Dependabot ikut diuji CI,
# sehingga pembaruan yang merusak tertahan sebelum digabung. Pembaruan minor/patch dikelompokkan
# agar PR tidak menumpuk dan tidak saling konflik pada lockfile.

version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      composer-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
