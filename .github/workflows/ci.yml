# CI Sistem Manajemen Sekolah.
#
# Setiap push ke main dan setiap Pull Request harus lolos seluruh job berikut sebelum digabung:
#   1. kualitas  — format kode (Pint), static analysis (PHPStan level 8), TypeScript, lockfile.
#   2. keamanan  — audit kerentanan dependency Composer & npm.
#   3. test      — seluruh test Pest di SQLite (PHP 8.3 & 8.4) dan MySQL 8 (database produksi).
#
# Setiap Action dikunci ke SHA commit (komentar = versinya), bukan tag yang bisa digeser pemiliknya
# (SEC-09, supply chain). Dependabot memperbarui SHA + komentar tersebut setiap minggu.
#
# Jalankan hal yang sama secara lokal: composer validate --strict && vendor/bin/pint --test &&
# composer analyse && npm run typecheck && php artisan test

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Push baru ke branch/PR yang sama membatalkan run lama yang masih berjalan.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PHP_VERSION: '8.3'
  NODE_VERSION: '24'
  PHP_EXTENSIONS: mbstring, intl, pdo_sqlite, pdo_mysql, zip, fileinfo, dom, xml

jobs:
  kualitas:
    name: Kualitas kode
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      # composer.json & composer.lock harus konsisten (mencegah konflik lockfile antar-branch).
      - name: Validasi composer.json & composer.lock
        run: composer validate --strict

      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # npm ci gagal bila package-lock.json tidak sinkron dengan package.json.
      - name: Install dependency npm
        run: npm ci --ignore-scripts

      - name: Format kode (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan level 8)
        run: composer analyse -- --no-progress --error-format=github

      - name: TypeScript (tsc)
        run: npm run typecheck

  keamanan:
    name: Audit keamanan dependency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Audit Composer
        run: composer audit --locked

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit npm (tingkat high ke atas)
        run: npm audit --audit-level=high

  test:
    name: Test (PHP ${{ matrix.php }}, ${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: kualitas
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        database: [sqlite]
        include:
          # Database produksi: menangkap perbedaan MySQL (collation, SQL CASE pengurutan Tingkat, dll).
          - php: '8.3'
            database: mysql

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: testing_sekolah_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Halaman yang dirender test memakai @vite, sehingga manifest hasil build dibutuhkan.
      - name: Build aset frontend
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Siapkan .env
        run: |
          cp .env.example .env
          php artisan key:generate

      # Variabel environment mengalahkan nilai default di phpunit.xml (SQLite :memory:).
      - name: Arahkan test ke MySQL
        if: matrix.database == 'mysql'
        run: |
          echo "DB_CONNECTION=mysql" >> "$GITHUB_ENV"
          echo "DB_HOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "DB_PORT=3306" >> "$GITHUB_ENV"
          echo "DB_DATABASE=testing_sekolah_ci" >> "$GITHUB_ENV"
          echo "DB_USERNAME=root" >> "$GITHUB_ENV"
          echo "DB_PASSWORD=" >> "$GITHUB_ENV"

      - name: Jalankan test
        run: php artisan test --ci
